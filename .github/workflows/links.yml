name: Check links

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # vikulega, mánudaga kl. 06:00 UTC

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Byggir bókina (freeze -> engan R) svo hægt sé að athuga raunverulegu
      # HTML-úttakssíðurnar, þar sem .qmd-hlekkir eru orðnir að .html.
      - name: Render book
        working-directory: docs
        run: quarto render

      # Á PR/dispatch athugum við aðeins innri hlekki (--offline): áreiðanlegt og
      # án falskra falla vegna hægra/tímabundinna ytri vefsvæða. Vikulega
      # tímasetta keyrslan athugar líka ytri hlekki.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            ${{ github.event_name == 'schedule' && '--max-retries 2' || '--offline' }}
            "_site/**/*.html"
          fail: true
