name: Render, check links, and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # vikulega, mánudaga kl. 06:00 UTC — athugar líka ytri hlekki

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Byggir bókina einu sinni og deilir úttakinu (_site) með hinum verkunum.
  build:
    runs-on: ubuntu-latest
    container: posit/r-base:4.6-noble
    defaults:
      run:
        shell: bash
    env:
      R_LIBS_USER: ${{ github.workspace }}/.ci-r-library
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      # R er þegar uppsett; aðeins verkfæri fyrir Actions og pakkana vantar.
      - name: Install build tools
        run: |
          apt-get install -y --no-install-recommends sudo ca-certificates curl wget jq git zstd lsb-release libcurl4-openssl-dev libssl-dev
          apt-get install -y --no-install-recommends sudo ca-certificates curl wget jq git zstd libcurl4-openssl-dev libssl-dev

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      # Pakkarnir eru taldir upp í requirements.txt, sömu skrá og notuð er
      # staðbundið, svo byggingin keyri á sömu útgáfum og höfundur þróaði með.
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          echo "RETICULATE_PYTHON=$(which python)" >> "$GITHUB_ENV"

      - name: Inspect preinstalled R
        id: r
        run: |
          Rscript -e 'cat("version=", as.character(getRversion()), "\n", sep="", file=Sys.getenv("GITHUB_OUTPUT"), append=TRUE)'
          mkdir -p "$R_LIBS_USER"

      - name: Restore R packages
        id: r-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-noble-${{ runner.arch }}-${{ steps.r.outputs.version }}-${{ hashFiles('.github/workflows/publish.yml') }}

      # knitr    <- Quarto notar hann til að keyra alla {r}-búta. Hann fylgir
      #             plotly sem ósjálfstæði, en er talinn upp berum orðum svo
      #             byggingin brotni ekki þótt sú keðja breytist.
      # plotly   <- reproducible-reports/quarto.qmd
      # httr2, jsonlite, dplyr <- api/*.qmd
      # httpuv   <- req_dry_run() i api/fetching-data.qmd. httr2 telur hann
      #             ekki upp sem nauðsyn, svo hann verður að koma sérstaklega.
      # curl     <- httr2 notar hann í url_parse(). Hann fylgir httr2 sem
      #             ósjálfstæði, en er talinn upp hér líka svo bilun í honum
      #             stöðvi þetta skref í stað þess að birtast 40 skrám síðar
      #             sem "there is no package called 'curl'".
      # reticulate <- Quarto/knitr notar hann til að keyra {python}-búta.
      # readr    <- eval: false skriftudæmi í api/fetching-data.qmd, talið upp hér
      #             svo nemendur geti keyrt sömu uppskriftir án þess að leita.
      # DBI, RSQLite <- {sql}-bútar á data/kennarar.db í sql-basics/introduction.qmd
      - name: Install R packages
        if: steps.r-cache.outputs.cache-hit != 'true'
        run: |
          Rscript -e 'packages <- c("knitr", "reticulate", "plotly", "httr2", "httpuv", "curl", "jsonlite", "dplyr", "readr", "DBI", "RSQLite"); install.packages(packages, repos="https://packagemanager.posit.co/cran/__linux__/noble/latest"); stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly=TRUE)))'

      # Vista strax eftir uppsetningu, jafnvel þótt seinna render falli.
      - name: Save R packages
        if: steps.r-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ steps.r-cache.outputs.cache-primary-key }}

      # Bútarnir lesa GITHUB_TOKEN úr umhverfinu. Án hans keyra GitHub-beiðnirnar
      # óauðkenndar og lenda á 60/klst markinu; með honum eru mörkin 5.000/klst.
      # Actions býr tokenið til sjálfkrafa og það rennur út með keyrslunni.
      - name: Render book and standalone slides
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          quarto render
          python ../scripts/copy_slide_outputs.py --render

      # Deilt með link-check verkinu (og hverju sem er sem þarf úttakið).
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

      # Sérstakt Pages-snið fyrir útgáfu (aðeins notað við push á main).
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Athugar hlekki á sömu byggingu — ekkert endurþýtt.
  links:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      # Á PR/dispatch athugum við aðeins innri hlekki (--offline): áreiðanlegt og
      # án falskra falla vegna hægra/tímabundinna ytri vefsvæða. Vikulega
      # tímasetta keyrslan athugar líka ytri hlekki.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-loopback
            ${{ github.event_name == 'schedule' && '--max-retries 2' || '--offline' }}
            "_site/**/*.html"
          fail: true

  # Útgáfa á GitHub Pages — aðeins við push á main.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
