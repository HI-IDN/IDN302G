name: Render, check links, and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # vikulega, mánudaga kl. 06:00 UTC — athugar líka ytri hlekki

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Byggir bókina einu sinni og deilir úttakinu (_site) með hinum verkunum.
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas python-dotenv
          echo "RETICULATE_PYTHON=$(which python)" >> "$GITHUB_ENV"

      # Nokkrir kaflar keyra raunverulegan R-kóða við þýðingu, svo R þarf að vera
      # til staðar. Pökkum sótt sem forþýdd tvíundargögn gegnum RSPM (fljótt).
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # knitr    <- Quarto notar hann til að keyra alla {r}-búta. Hann fylgir
      #             plotly sem ósjálfstæði, en er talinn upp berum orðum svo
      #             byggingin brotni ekki þótt sú keðja breytist.
      # plotly   <- reproducible-reports/quarto.qmd
      # httr2, jsonlite, dplyr <- api/*.qmd
      # reticulate <- Quarto/knitr notar hann til að keyra {python}-búta.
      # readr    <- eval: false skriftudæmi í api/fetching-data.qmd, talið upp hér
      #             svo nemendur geti keyrt sömu uppskriftir án þess að leita.
      - name: Install R packages
        run: Rscript -e 'install.packages(c("knitr", "reticulate", "plotly", "httr2", "jsonlite", "dplyr", "readr"))'

      - name: Render book and standalone slides
        working-directory: docs
        run: |
          quarto render
          quarto render slides/intro.qmd
          mkdir -p ../_site/slides
          mkdir -p ../_site/styles
          rm -f ../_site/slides/intro.html
          rm -rf ../_site/slides/intro_files
          cp -r slides/intro.html slides/intro_files ../_site/slides/
          cp styles/watermark.css ../_site/styles/watermark.css

      # Deilt með link-check verkinu (og hverju sem er sem þarf úttakið).
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

      # Sérstakt Pages-snið fyrir útgáfu (aðeins notað við push á main).
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Athugar hlekki á sömu byggingu — ekkert endurþýtt.
  links:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      # Á PR/dispatch athugum við aðeins innri hlekki (--offline): áreiðanlegt og
      # án falskra falla vegna hægra/tímabundinna ytri vefsvæða. Vikulega
      # tímasetta keyrslan athugar líka ytri hlekki.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            ${{ github.event_name == 'schedule' && '--max-retries 2' || '--offline' }}
            "_site/**/*.html"
          fail: true

  # Útgáfa á GitHub Pages — aðeins við push á main.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
