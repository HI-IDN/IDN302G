name: Render and publish Quarto book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # No R setup needed: executed code results are committed in docs/_freeze/
      # (execute: freeze: auto in _quarto.yml). Quarto reuses them instead of
      # re-running R in the cloud.
      - name: Render book and standalone slides
        working-directory: docs
        run: |
          quarto render --execute never
          quarto render slides/intro.qmd --execute never
          mkdir -p ../_site/slides
          mkdir -p ../_site/styles
          rm -f ../_site/slides/intro.html
          rm -rf ../_site/slides/intro_files
          cp -r slides/intro.html slides/intro_files ../_site/slides/
          cp styles/watermark.css ../_site/styles/watermark.css

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
