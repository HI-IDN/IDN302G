project:
  type: book
  output-dir: ../docs
  resources:
    - .nojekyll
    - templates/

book:
  title: "Upplýsingaverkfræði IÐN302G"
  author: "Helga Ingimundardóttir"
  language: is
  repo-url: https://github.com/HI-IDN/IDN302G
  repo-actions: [edit, issue]
  site-url: https://hi-idn.github.io/IDN302G
  favicon: img/hi/favicon.svg
  search: true
  page-footer:
    left: "© Háskóli Íslands · IÐN302G"
    center: "Helga Ingimundardóttir"
    right:
      - icon: github
        href: https://github.com/HI-IDN/IDN302G
        aria-label: GitHub
  navbar:
    logo: img/hi/hi_named_logo-is.svg
    logo-alt: "Háskóli Íslands"
    background: primary
    tools:
      - icon: github
        href: https://github.com/HI-IDN/IDN302G
        aria-label: GitHub
  sidebar:
    style: docked
    background: light
    collapse-level: 1
  chapters:
    - part: index.qmd
      chapters:
        - about-course/about.qmd
        - about-course/curriculum.qmd
        - about-course/teaching-methods.qmd
        - about-course/group-project.qmd
        - about-course/schedule.qmd
        - about-course/learning-outcomes.qmd
        - about-course/how-to-use.qmd
    - part: "Git og GitHub"
      chapters:
        - github/index.qmd
        - github/grunnatridi/git_commands.qmd
        - github/grunnatridi/security_best_practices.qmd
        - github/grunnatridi/gitignore.qmd
        - github/grunnatridi/file_formats.qmd
        - github/god_vinnubrogd/git_branches.qmd
        - github/god_vinnubrogd/writing_good_commits.qmd
        - github/god_vinnubrogd/pull_requests.qmd
        - github/god_vinnubrogd/code_review.qmd
        - github/god_vinnubrogd/writing_a_readme.qmd
        - github/tengingar/overleaf_git_sync.qmd
    - part: "Erindrekar"
      chapters:
        - ai-tools/index.qmd
        - ai-tools/responsible-use.qmd
        - ai-tools/reviewing-agents.qmd
    - part: "Endurtækar skýrslur"
      chapters:
        - reproducible-reports/index.qmd
    - part: "Reglulegar segðir"
      chapters:
        - regex/index.md
    - part: "Rökfræði og mengi"
      chapters:
        - logic-sets/index.qmd
    - part: "SQL grunnatriði"
      chapters:
        - sql-basics/introduction.md
        - sql-basics/basic_sql_queries.md
        - sql-basics/tables.md
        - sql-basics/aggregation_and_grouping.md
        - sql-basics/null.md
        - sql-basics/subquery.md
        - sql-basics/data_integrity.md
        - sql-basics/import_export_data.md
        - sql-basics/script_files.md
        - sql-basics/database_interaction.md
        - sql-basics/exercises.md
        - sql-basics/additional_resources.md
    - part: "SQL framhald"
      chapters:
        - sql-advanced/introduction.md
        - sql-advanced/postgres.md
        - sql-advanced/union.md
        - sql-advanced/joins.md
        - sql-advanced/views.md
        - sql-advanced/functions.md
        - sql-advanced/cte.md
        - sql-advanced/postgis.md
    - part: "Myndræn framsetning"
      chapters:
        - storytelling/introduction.md
        - storytelling/lightning_talk.md
        - storytelling/visuals_major.md
        - storytelling/visuals_minor.md
        - storytelling/interactive.md
        - storytelling/dashboard.md
        - storytelling/donts.md
        - storytelling/data_narrative.md
        - storytelling/additional_resources.md
    - part: "Um efnið"
      chapters:
        - about-material/license.qmd
        - about-material/contributing.qmd
        - about-material/contact.qmd

format:
  html:
    theme:
      - cosmo
      - styles/hi-book.scss
    include-in-header: partials/header-includes.inc
    include-after-body: partials/breadcrumb.inc
    toc: true
    toc-depth: 4
    toc-title: "Á þessari síðu"
    lang: is
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    number-sections: false
