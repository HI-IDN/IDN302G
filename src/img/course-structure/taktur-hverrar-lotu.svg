<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="410" viewBox="0 0 1520 410" role="img" aria-labelledby="title desc">
  <title id="title">Taktur hverrar lotu</title>
  <desc id="desc">Fimm skref lotu: Undirbúningur, iRAT/tRAT, tAPP, iREF og iTA/Q&amp;A.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#262626" flood-opacity="0.18"/>
    </filter>
    <style>
      .label { font-family: Jost, Segoe UI, Arial, sans-serif; font-size: 34px; font-weight: 900; }
      .body { font-family: Jost, Segoe UI, Arial, sans-serif; font-size: 19px; font-weight: 800; }
      .num { font-family: Jost, Segoe UI, Arial, sans-serif; font-size: 36px; font-weight: 900; }
      .white { fill: #ffffff; }
      .blue { fill: #10099F; }
      .ink { fill: #262626; }
    </style>
  </defs>

  <g filter="url(#shadow)" transform="translate(-40 -105)">
    <!-- 1 -->
    <polygon points="60,125 340,125 392,300 340,475 60,475" fill="#10099F"/>
    <circle cx="122" cy="195" r="38" fill="#ffffff" opacity="0.96"/>
    <text x="122" y="208" class="num blue" text-anchor="middle">1</text>
    <text x="78" y="275" class="label white">iPREP</text>
    <text x="78" y="318" class="body white">Einstaklingar undirbúa sig</text>
    <text x="78" y="346" class="body white">heima, kynna sér lesefni</text>
    <text x="78" y="374" class="body white">og setja verkefnið í</text>
    <text x="78" y="402" class="body white">samhengi við lotuna.</text>

    <!-- 2 -->
    <polygon points="340,125 620,125 672,300 620,475 340,475 392,300" fill="#2DD2C0"/>
    <circle cx="426" cy="195" r="38" fill="#ffffff" opacity="0.96"/>
    <text x="426" y="208" class="num blue" text-anchor="middle">2</text>
    <text x="410" y="275" class="label blue">iRAT/tRAT</text>
    <text x="410" y="318" class="body blue">Fyrst einstaklingspróf,</text>
    <text x="410" y="346" class="body blue">síðan teymispróf þar sem</text>
    <text x="410" y="374" class="body blue">hópurinn ræðir sömu</text>
    <text x="410" y="402" class="body blue">spurningar.</text>

    <!-- 3 -->
    <polygon points="620,125 900,125 952,300 900,475 620,475 672,300" fill="#FAC55B"/>
    <circle cx="706" cy="195" r="38" fill="#ffffff" opacity="0.96"/>
    <text x="706" y="208" class="num blue" text-anchor="middle">3</text>
    <text x="688" y="275" class="label ink">tAPP</text>
    <text x="688" y="318" class="body ink">Hópurinn beitir aðferð</text>
    <text x="688" y="346" class="body ink">lotunnar á eigið</text>
    <text x="688" y="374" class="body ink">verkefni og gögn.</text>

    <!-- 4 -->
    <polygon points="900,125 1180,125 1232,300 1180,475 900,475 952,300" fill="#FFA05F"/>
    <circle cx="986" cy="195" r="38" fill="#ffffff" opacity="0.96"/>
    <text x="986" y="208" class="num blue" text-anchor="middle">4</text>
    <text x="970" y="275" class="label white">iREF</text>
    <text x="970" y="318" class="body white">Hver nemandi skilar</text>
    <text x="970" y="346" class="body white">stuttri ígrundun um</text>
    <text x="970" y="374" class="body white">eigin lærdóm</text>
    <text x="970" y="402" class="body white">og framlag.</text>

    <!-- 5 ending block -->
    <polygon points="1180,125 1540,125 1540,475 1180,475 1232,300" fill="#FC8484"/>
    <circle cx="1266" cy="195" r="38" fill="#ffffff" opacity="0.96"/>
    <text x="1266" y="208" class="num blue" text-anchor="middle">5</text>
    <text x="1248" y="275" class="label white">iTA / Q&amp;A</text>
    <text x="1248" y="318" class="body white">Eftirfylgni þar sem</text>
    <text x="1248" y="346" class="body white">kennari spyr út í</text>
    <text x="1248" y="374" class="body white">verkefnið og hópurinn</text>
    <text x="1248" y="402" class="body white">skýrir ákvarðanir sínar.</text>
  </g>
</svg>
