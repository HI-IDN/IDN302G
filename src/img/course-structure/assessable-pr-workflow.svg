<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title desc"
     font-family="Jost, Segoe UI, system-ui, sans-serif">
  <title id="title">Sýnileg PR-vinnusaga</title>
  <desc id="desc">Greinarit sem sýnir hvernig þrír nemendur vinna á aðskildum branches, rýna vinnu hvers annars og sameina breytingar eftir yfirferð.</desc>

  <defs>
    <marker id="arr-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ffa000"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888"/>
    </marker>
    <style>
      .lane { font-family: "JetBrains Mono", "Fira Code", ui-monospace, monospace; font-size: 17px; fill: #1a1a2e; }
      .who { font-size: 15px; font-style: italic; fill: #555; }
      .small { font-size: 13px; font-style: italic; fill: #777; }
      .line { stroke: #1a1a2e; stroke-width: 2; fill: none; }
      .commit { fill: #1a1a2e; }
      .merge { stroke: #ffa000; stroke-width: 5; fill: none; marker-end: url(#arr-orange); }
      .sync { stroke: #888; stroke-width: 2; stroke-dasharray: 6 5; fill: none; marker-end: url(#arr-gray); }
      .blue { fill: #10099F; }
    </style>
  </defs>

  <text class="lane" x="120" y="56" text-anchor="end">main:</text>
  <text class="who" x="130" y="56">A+B+C</text>
  <text class="lane" x="120" y="116" text-anchor="end">core-work:</text>
  <text class="who" x="130" y="116">A</text>
  <text class="lane" x="120" y="176" text-anchor="end">feature-1:</text>
  <text class="who" x="130" y="176">B</text>
  <text class="lane" x="120" y="236" text-anchor="end">feature-2:</text>
  <text class="who" x="130" y="236">C</text>

  <!-- main -->
  <line class="line" x1="220" y1="56" x2="690" y2="56"/>
  <circle class="commit" cx="220" cy="56" r="6"/>
  <circle class="commit" cx="560" cy="56" r="6"/>
  <circle class="commit" cx="690" cy="56" r="6"/>
  <text class="small" x="220" y="35" text-anchor="middle">template</text>
  <text class="small" x="690" y="35" text-anchor="middle">final result</text>

  <!-- core work -->
  <path class="line" d="M220,56 C245,78 260,102 295,116"/>
  <line class="line" x1="295" y1="116" x2="585" y2="116"/>
  <circle class="commit" cx="295" cy="116" r="6"/>
  <circle class="commit" cx="365" cy="116" r="6"/>
  <circle class="commit" cx="435" cy="116" r="6"/>
  <circle class="commit" cx="505" cy="116" r="6"/>
  <circle class="commit" cx="585" cy="116" r="6"/>

  <!-- feature 1 -->
  <path class="line" d="M365,116 C380,140 398,160 420,176"/>
  <line class="line" x1="420" y1="176" x2="470" y2="176"/>
  <circle class="commit" cx="420" cy="176" r="6"/>
  <circle class="commit" cx="470" cy="176" r="6"/>
  <path class="merge" d="M470,176 C505,168 502,137 505,116"/>

  <!-- feature 2 -->
  <path class="line" d="M220,56 C235,116 265,215 325,236"/>
  <line class="line" x1="325" y1="236" x2="510" y2="236"/>
  <circle class="commit" cx="325" cy="236" r="6"/>
  <circle class="commit" cx="430" cy="236" r="6"/>
  <circle class="commit" cx="510" cy="236" r="6"/>
  <line x1="430" y1="236" x2="510" y2="236" stroke="#ffa000" stroke-width="5"/>
  <path class="merge" d="M510,236 C548,192 552,100 560,56"/>

  <!-- sync and final merge -->
  <path class="sync" d="M560,56 C570,80 575,98 585,116"/>
  <text class="small" x="580" y="84">sync</text>
  <path class="merge" d="M585,116 C620,96 650,76 690,56"/>

  <!-- right annotations -->
  <text class="small" x="730" y="56">feedback: kennari</text>
  <text class="small" x="730" y="116">review: B + C</text>
  <text class="small" x="730" y="176">review: A + C</text>
  <text class="small" x="730" y="236">review: A + B</text>

  <text class="small" x="450" y="282" text-anchor="middle">
    Sýnileg vinna: hver vann hvað, hver rýndi, hvað var sameinað og hvenær.
  </text>
</svg>
