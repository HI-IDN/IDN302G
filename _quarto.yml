project:
  type: book
  output-dir: docs
  resources:
    - .nojekyll

book:
  title: "Upplýsingaverkfræði IÐN302G"
  author: "Helga Ingimundardóttir"
  language: is
  repo-url: https://github.com/HI-IDN/IDN302G
  repo-actions: [edit]
  site-url: https://hi-idn.github.io/IDN302G
  favicon: img/hi/favicon.svg
  search: true
  page-footer:
    left: "© Háskóli Íslands · IÐN302G"
    right:
      - icon: github
        href: https://github.com/HI-IDN/IDN302G
        aria-label: GitHub
  navbar:
    logo: img/hi/hi_named_logo-is.svg
    logo-alt: "Háskóli Íslands"
    background: primary
    tools:
      - icon: github
        href: https://github.com/HI-IDN/IDN302G
        aria-label: GitHub
  sidebar:
    style: docked
    background: light
  chapters:
    - index.qmd
    - part: "SQL grunnatriði"
      chapters:
        - sql-basics/introduction.md
        - sql-basics/basic_sql_queries.md
        - sql-basics/tables.md
        - sql-basics/aggregation_and_grouping.md
        - sql-basics/null.md
        - sql-basics/subquery.md
        - sql-basics/data_integrity.md
        - sql-basics/import_export_data.md
        - sql-basics/script_files.md
        - sql-basics/database_interaction.md
        - sql-basics/exercises.md
        - sql-basics/additional_resources.md
    - part: "SQL framhald"
      chapters:
        - sql-advanced/introduction.md
        - sql-advanced/postgres.md
        - sql-advanced/union.md
        - sql-advanced/joins.md
        - sql-advanced/views.md
        - sql-advanced/functions.md
        - sql-advanced/cte.md
        - sql-advanced/postgis.md
    - part: "Myndræn framsetning"
      chapters:
        - storytelling/introduction.md
        - storytelling/lightning_talk.md
        - storytelling/visuals_major.md
        - storytelling/visuals_minor.md
        - storytelling/interactive.md
        - storytelling/dashboard.md
        - storytelling/donts.md
        - storytelling/data_narrative.md
        - storytelling/additional_resources.md

format:
  html:
    theme:
      - cosmo
      - styles/hi-book.scss
    include-in-header: partials/header-includes.inc
    toc: true
    toc-depth: 3
    toc-title: "Á þessari síðu"
    lang: is
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    number-sections: true
